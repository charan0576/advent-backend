# Render Blueprint for Advent Tech Studio API + Remotion renderer.
# This file must be at the repository root next to Dockerfile.
services:
  - type: web
    name: advent-tech-api
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: advent-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: PEXELS_API_KEY
        sync: false
